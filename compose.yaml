name: pulsegrid
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: pulsegrid_local_only
      POSTGRES_DB: pulsegrid
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pulsegrid-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pulsegrid-db:
